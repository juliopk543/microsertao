<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<base href="/">
<title>Erro 404 – Página não encontrada | IBRASO conexões</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;
    background:linear-gradient(135deg,#490a7c 0%,#1f0a3d 100%);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  main{max-width:520px}
  .codigo{font-size:clamp(5rem,26vw,9rem);font-weight:800;line-height:1;letter-spacing:.02em;
    background:linear-gradient(180deg,#fff,rgba(255,255,255,.45));-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:clamp(1.4rem,5vw,2rem);margin:12px 0 14px}
  p{font-size:1.05rem;line-height:1.6;color:rgba(255,255,255,.85)}
  a.botao{display:inline-block;margin-top:28px;padding:13px 30px;border-radius:999px;background:#fff;color:#490a7c;
    font-weight:700;text-decoration:none;transition:transform .15s}
  a.botao:hover{transform:translateY(-2px)}
  .marca{margin-top:36px;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6)}
</style>
</head>
<body>
<main>
  <div class="codigo" aria-hidden="true">404</div>
  <h1>Erro 404 – Página não encontrada</h1>
  <p>O endereço que você tentou acessar não existe ou foi movido.</p>
  <a class="botao" href="/">Voltar ao início</a>
  <div class="marca">IBRASO conexões</div>
</main>
</body>
</html>

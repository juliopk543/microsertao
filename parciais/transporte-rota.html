    <!-- ===================================================================
         /transporte: tag animada acima da frente do onibus (desktop e mobile).
         Substitui o botao Vantagens. Uma tag unica alterna Check-in, Embarque,
         Comunicados, Destino, Avisos e Localizacao com um pulso; o onibus desce
         ate encostar na base do roxo. O carrossel de cards fica parado no
         primeiro card (Rota Universitaria) ate o usuario chegar nele.
         Injetado pelo gerar-paginas.py (nao existe no index.html).
    =================================================================== -->
    <style>
        .banner-btn-desktop { display: none !important; }

        .rota-tag {
            position: absolute; z-index: 6; left: 0; top: 0; pointer-events: none;
            height: auto !important; width: auto !important; /* o tema da altura cheia aos filhos do banner */
            display: flex; flex-direction: column; align-items: center; gap: 9px;
            /* o ponto fica centrado em left/top (--meio = metade do ponto) */
            --meio: 8px;
            transform: translate(-50%, calc(-100% + var(--meio)));
            opacity: 0; transition: opacity .4s;
        }
        .rota-tag.pronta { opacity: 1; }
        .rota-tag .rt-txt {
            color: #fff; font-family: "Nunito", sans-serif; font-weight: 800; font-size: 11px;
            letter-spacing: 3px; text-transform: uppercase; white-space: nowrap; line-height: 1;
            padding-left: 3px; /* compensa o espacamento depois da ultima letra */
        }
        .rota-tag .rt-dot { position: relative; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #fff; background: #490a7c; box-sizing: border-box; }
        .rota-tag .rt-dot::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid #fff; opacity: 0; }
        .rota-tag.hit .rt-txt { animation: rota-tag .6s ease-out; }
        .rota-tag.hit .rt-dot::after { animation: rota-ping .9s ease-out; }

        /* desktop: tag maior, no espaco livre acima do texto, entre a coluna e a frente do onibus */
        @media only screen and (min-width: 992px) {
            .rota-tag { --meio: 11px; gap: 14px; }
            .rota-tag .rt-txt { font-size: 22px; letter-spacing: 6px; padding-left: 6px; }
            .rota-tag .rt-dot { width: 22px; height: 22px; border-width: 4px; }
            .rota-tag .rt-dot::after { inset: -4px; }
        }

        @keyframes rota-tag { 0% { opacity: 0; transform: scale(.6); } 60% { opacity: 1; transform: scale(1.12); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes rota-ping { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3); opacity: 0; } }

        /* mobile: espaco para a tag acima do onibus e onibus encostado na base do roxo
           (no desktop o deslocamento e calculado no script) */
        @media only screen and (max-width: 991px) {
            .banner-area .thumb { margin-top: 64px; }
            .banner-area .double-items { padding-bottom: 0 !important; }
            .banner-area .banner-slider { margin-bottom: -2.7%; }
        }

        @media (prefers-reduced-motion: reduce) {
            .rota-tag.hit .rt-txt, .rota-tag.hit .rt-dot::after { animation: none; }
        }
    </style>
    <script>
        (function () {
            var TAGS = ['Check-in', 'Embarque', 'Comunicados', 'Destino', 'Avisos', 'Localização'];
            var TROCA = 2000;
            var VAZIO_BASE = 0.041;  // faixa transparente embaixo dos pneus no Onibus.png (fracao da altura)
            var calmo = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            var banner = document.querySelector('.banner-area');
            var slider = document.querySelector('.banner-area .banner-slider');
            if (!banner || !slider) return;

            var tag = document.createElement('div');
            tag.className = 'rota-tag';
            tag.setAttribute('aria-hidden', 'true');
            tag.innerHTML = '<span class="rt-txt">' + TAGS[0] + '</span><span class="rt-dot"></span>';
            banner.appendChild(tag);
            var txt = tag.querySelector('.rt-txt');

            // posicao no documento sem transform (a animacao fadeInRight desloca o getBoundingClientRect)
            function pos(el) {
                var x = 0, y = 0;
                while (el) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
                return { x: x, y: y };
            }

            function posicionar() {
                var mobile = window.matchMedia('(max-width: 991px)').matches;
                var b = pos(banner);
                var h = slider.offsetHeight, w = slider.offsetWidth;
                var x, y;
                if (!mobile) {
                    // desce o onibus ate os pneus encostarem na base do roxo
                    slider.style.top = '0px';
                    var s = pos(slider);
                    var dy = (b.y + banner.offsetHeight) - (s.y + h * (1 - VAZIO_BASE));
                    slider.style.top = Math.round(dy) + 'px';
                    // tag no espaco livre acima do titulo, logo depois da coluna de texto
                    var info = document.querySelector('.banner-area .info');
                    var h2 = document.querySelector('.banner-area h2');
                    x = pos(info).x - b.x + info.offsetWidth + 30;
                    y = pos(h2).y - b.y - 44;
                } else {
                    slider.style.top = '';
                    var s2 = pos(slider), th = pos(document.querySelector('.banner-area .thumb'));
                    x = s2.x - b.x + w * 0.39;
                    y = th.y - b.y - 14;
                }
                tag.style.left = Math.round(x) + 'px';
                tag.style.top = Math.round(y) + 'px';
                tag.classList.add('pronta');
            }

            var n = 0;
            // o segundo banner troca a lista de tags (window.rotaTagsLista)
            window.rotaTagsLista = function (lista) {
                TAGS = lista; n = 0;
                tag.classList.remove('hit'); void tag.offsetWidth;
                txt.textContent = TAGS[0]; tag.classList.add('hit');
            };
            function trocar() {
                n = (n + 1) % TAGS.length;
                txt.textContent = TAGS[n];
                tag.classList.remove('hit'); void tag.offsetWidth; tag.classList.add('hit');
            }
            if (!calmo) setInterval(trocar, TROCA);

            var espera;
            function agendar() { clearTimeout(espera); espera = setTimeout(posicionar, 120); }
            window.addEventListener('resize', agendar);
            if (window.ResizeObserver) new ResizeObserver(agendar).observe(banner);
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(agendar);
            posicionar();

            window.addEventListener('load', function () {
                posicionar();
                setTimeout(posicionar, 1200);
                if (!window.jQuery) return;

                // o carrossel fica parado no primeiro card (Rota Universitaria) ate o usuario
                // chegar nele; dai em diante passa um card de cada vez.
                // (o plugin de autoplay le settings.autoplay, recalculado de options a cada breakpoint)
                var car = jQuery('.feature-carousel'), liberado = false;
                var autoplay = function (sim) {
                    var owl = car.data('owl.carousel');
                    if (!owl) return;
                    owl.options.autoplay = sim; owl.settings.autoplay = sim;
                    car.trigger(sim ? 'play.owl.autoplay' : 'stop.owl.autoplay');
                };
                var segura = function () { if (!liberado) autoplay(false); };
                segura();
                car.on('initialized.owl.carousel', function () { setTimeout(segura, 0); });
                // no desktop (>=1000px) o carrossel nunca avanca sozinho: so o usuario arrasta.
                var liberar = function () { if (!liberado) { liberado = true; if (window.innerWidth < 1000) autoplay(true); } };
                if (window.IntersectionObserver && car[0]) {
                    var io = new IntersectionObserver(function (ents) {
                        if (ents[0].isIntersecting) { io.disconnect(); liberar(); }
                    }, { threshold: 0.35 });
                    io.observe(car[0]);
                } else {
                    liberar();
                }
            });
        })();
    </script>

    <!-- ===================================================================
         /transporte: segundo banner no header. A cada poucos segundos o banner inteiro
         desliza: o fundo roxo troca pelo "Papel de Parede Abstrato Azul Ciano" e o onibus
         sai para dar lugar ao "Casal conectado no cafe". Depois volta ao primeiro.
    =================================================================== -->
    <style>
        .banner-area { isolation: isolate; }
        .banner-area .banner-bg2 {
            position: absolute; inset: 0; z-index: -1; pointer-events: none;
            background: #004b7c url("images/banner2-fundo.jpg") center / cover no-repeat;
            opacity: 0; transition: opacity .9s ease;
        }
        .banner-area.b2 .banner-bg2 { opacity: 1; }
        .banner-slider .casal-slide {
            position: absolute; bottom: 4%; left: 0; right: 0; margin: 0 auto;
            height: 96%; width: auto; max-width: 100%;
            transform: scale(.9); transform-origin: 50% 100%; opacity: 0;
            transition: transform .9s ease, opacity .9s ease;
        }
        .banner-area.b2 .banner-slider .casal-slide { transform: scale(1); opacity: 1; }
        .banner-area.b2 .banner-slider.slid .is-next { transform: scale(.9); opacity: 0; }
        /* imagens do slide surgem (fade + leve crescimento) em vez de deslizar */
        .banner-slider .is-next { transform: scale(.9); transform-origin: 50% 100%; }
        .banner-slider.slid .is-active { transform: none; opacity: 0; }
        .banner-slider.slid .is-next { transform: scale(1); opacity: 1; }
        .banner-area .rota-tag { transition: opacity .4s; }
        /* faixa da logo e navbar acompanham a cor do segundo banner */
        nav.navbar.navbar-default.bootsnav a.navbar-brand::before { transition: background-color .9s ease; }
        html.banner2 nav.navbar.navbar-default.bootsnav a.navbar-brand::before { background-color: #004b7c; }
        @media only screen and (max-width: 991px) {
            nav.navbar.navbar-default.bootsnav { transition: background-color .9s ease; }
            html.banner2 nav.navbar.navbar-default.bootsnav,
            html.banner2 nav.navbar.navbar-default.bootsnav .navbar-collapse { background: #004b7c; border-color: #004b7c; }
        }
        @media (prefers-reduced-motion: reduce) {
            .banner-area .banner-bg2, .banner-slider .casal-slide { transition: none; }
        }
    </style>
    <script>
        (function () {
            var banner = document.querySelector('.banner-area');
            var slider = document.querySelector('.banner-area .banner-slider');
            if (!banner || !slider) return;
            var bg = document.createElement('div');
            bg.className = 'banner-bg2';
            bg.setAttribute('aria-hidden', 'true');
            banner.insertBefore(bg, banner.firstChild);
            var img = document.createElement('img');
            img.className = 'casal-slide';
            img.decoding = 'async';
            img.src = 'images/casal.webp';
            img.alt = 'Casal usando o IBRASO conexões em um café';
            slider.appendChild(img);
            // texto do subtitulo de cada banner
            var sub = banner.querySelector('.banner-sub');
            var TEXTOS = [sub ? sub.textContent : '', 'Canal digital de comunicação pública, integração com o setor gastronômico.'];
            if (sub) sub.style.transition = 'opacity .3s ease';
            var TAGS1 = ['Check-in', 'Embarque', 'Comunicados', 'Destino', 'Avisos', 'Localização'];
            var TAGS2 = ['Cardápio digital', 'Rotas e passeios', 'Marés e praias', 'Cultura e região'];
            var atual = 0, trocaTxt;
            function mostrar(n) {
                if (n === atual) return;
                atual = n;
                var segundo = n === 1;
                try { history.replaceState(null, '', segundo ? '/turismo' : '/transporte'); } catch (err) {}
                if (window.rotaTagsLista) window.rotaTagsLista(segundo ? TAGS2 : TAGS1);
                banner.classList.toggle('b2', segundo);
                document.documentElement.classList.toggle('banner2', segundo);
                if (sub) {
                    clearTimeout(trocaTxt);
                    sub.style.opacity = '0';
                    trocaTxt = setTimeout(function () { sub.textContent = TEXTOS[n]; sub.style.opacity = '1'; }, 300);
                }
            }
            // banner 1 <-> card Secretaria de Transporte (1o); banner 2 <-> card Secretaria de Turismo (2o).
            // Os dois seguem juntos: o card muda o banner e o deslize no banner muda o card.
            // Nos demais cards o banner volta ao primeiro.
            function ligar() {
                var car = jQuery('.feature-carousel');
                if (!car.length) return;
                car.on('changed.owl.carousel', function (e) {
                    if (!e.item || !e.property || e.property.name !== 'position') return;
                    mostrar(e.relatedTarget.relative(e.item.index) === 1 ? 1 : 0);
                });
                var x0 = null, y0 = 0;
                banner.addEventListener('touchstart', function (e) {
                    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
                }, { passive: true });
                banner.addEventListener('touchend', function (e) {
                    if (x0 === null) return;
                    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
                    x0 = null;
                    if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
                    var alvo = dx < 0 ? 1 : 0;       // desliza para a esquerda = proximo banner
                    if (alvo === atual) return;
                    mostrar(alvo);
                    car.trigger('to.owl.carousel', [alvo, 400, true]);
                }, { passive: true });
            }
            if (window.jQuery) ligar();
            // /turismo abre ja no segundo banner e no card de Turismo
            if (window.BANNER_INICIAL === 1) {
                mostrar(1);
                window.addEventListener('load', function () {
                    if (window.jQuery) setTimeout(function () { jQuery('.feature-carousel').trigger('to.owl.carousel', [1, 0, true]); }, 100);
                });
            }
        })();
    </script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Site em manutenção – IBRASO conexões</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;
    background:linear-gradient(135deg,#490a7c 0%,#1f0a3d 100%);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  main{max-width:520px}
  .icone{width:84px;height:84px;margin:0 auto 28px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
  .icone svg{width:44px;height:44px;animation:gira 6s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  h1{font-size:clamp(1.7rem,6vw,2.4rem);margin-bottom:14px;line-height:1.2}
  p{font-size:1.05rem;line-height:1.6;color:rgba(255,255,255,.85)}
  .marca{margin-top:36px;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6)}
</style>
</head>
<body>
<main>
  <div class="icone" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.4 2.4-2.6-.6-.6-2.6z"/></svg>
  </div>
  <h1>Site em manutenção</h1>
  <p>Estamos fazendo melhorias para você. Voltamos em breve.</p>
  <div class="marca">IBRASO conexões</div>
</main>
</body>
</html>
